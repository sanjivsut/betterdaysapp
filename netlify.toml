[build]
  command = "npm run build"
  publish = ".next"
  # Run migrations manually against the production DB, once:
  #   DATABASE_URL="<prod connection string>" npm run db:migrate
  # (or paste src/lib/schema.sql into the Netlify DB SQL console). schema.sql
  # is idempotent, so re-running it is safe.

[build.environment]
  NODE_VERSION = "20"

# Netlify's official Next.js runtime. It serves SSG pages as static assets and
# only invokes functions for routes that need server logic (route handlers,
# auth callbacks).
[[plugins]]
  package = "@netlify/plugin-nextjs"
